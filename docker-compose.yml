services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados_banco:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede_interna
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      DB_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:5000"
    volumes:
      - fotos:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna
    restart: unless-stopped

networks:
  rede_interna:
    driver: bridge

volumes:
  dados_banco:
  fotos:
